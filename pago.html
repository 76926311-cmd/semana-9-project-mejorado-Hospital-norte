<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagar servicio - Hospital EsSalud Norte Chico</title>
  <link rel="stylesheet" href="css/pago.css">
</head>
<body>
  <header>
    <div class="logo">Hospital ESSALUD Norte Chico</div>
    <nav aria-label="Navegación principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="registro.html">Registrar cita</a></li>
        <li><a href="consulta.html">Mis registros</a></li>
        <li><a href="pago.html">Pagar</a></li>
        <li><a href="login.html" id="btn-salir">Cerrar sesión</a></li>
      </ul>
    </nav>
  </header>

  <main class="contenedor-pago">
    <h1>Pago en línea</h1>

    <section aria-labelledby="t-resumen">
      <h2 id="t-resumen">Resumen</h2>
      <label for="registro">Solicitud a pagar</label>
      <select id="registro" name="registro"></select>
      <p>Total a pagar: <strong id="resumen-monto">—</strong></p>
    </section>

    <fieldset>
      <legend>Método de pago</legend>
      <label><input type="radio" name="metodo" value="tarjeta" checked> Tarjeta de débito o crédito</label>
      <label><input type="radio" name="metodo" value="billetera"> Billetera electrónica</label>
    </fieldset>

    <form id="form-tarjeta" novalidate>
      <label for="numero">Número de tarjeta</label>
      <input id="numero" name="numero" inputmode="numeric" autocomplete="cc-number" maxlength="23" 
             required aria-describedby="marca-detectada error-numero">
      <span id="marca-detectada"></span>
      <span id="error-numero" class="error"></span>

      <label for="vencimiento">Vencimiento (MM/AA)</label>
      <input id="vencimiento" name="vencimiento" inputmode="numeric" autocomplete="cc-exp" maxlength="5"
             placeholder="MM/AA" required aria-describedby="error-vencimiento">
      <span id="error-vencimiento" class="error"></span>

      <label for="cvv">CVV</label>
      <input id="cvv" name="cvv" type="password" inputmode="numeric" autocomplete="cc-csc" maxlength="4"
             required aria-describedby="error-cvv">
      <span id="error-cvv" class="error"></span>

      <label for="titular">Nombre del titular</label>
      <input id="titular" name="titular" autocomplete="cc-name" required aria-describedby="error-titular">
      <span id="error-titular" class="error"></span>

      <button type="submit">Pagar con tarjeta</button>
    </form>

    <form id="form-billetera" novalidate hidden>
      <label for="proveedor">Billetera</label>
      <select id="proveedor" name="proveedor">
        <option value="andipay">AndiPay</option>
        <option value="pagomovil">PagoMóvil</option>
      </select>

      <label for="celular">Celular afiliado</label>
      <input id="celular" name="celular" inputmode="numeric" autocomplete="tel-national" maxlength="9"
             required aria-describedby="error-celular">
      <span id="error-celular" class="error"></span>

      <label for="codigo">Código de aprobación (6 dígitos que muestra tu billetera)</label>
      <input id="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
             required aria-describedby="error-codigo">
      <span id="error-codigo" class="error"></span>

      <button type="submit">Pagar con billetera</button>
    </form>

    <p id="mensaje-pago" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="js/pago/pago.js"></script>
</body>
</html>
